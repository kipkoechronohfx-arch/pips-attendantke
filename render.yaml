services:
  # ──────────────────────────────────────────────────────────
  # 1. Pips Attendant Main Web & Express Server
  # ──────────────────────────────────────────────────────────
  - type: web
    name: pips-attendantke
    runtime: node
    plan: free
    autoDeploy: true
    # Security: Pinned to Node.js 22.23.4+ to address Oct 2026 advisories:
    # - eMudhra CA certificate compromise
    # - TLS hostname check bypass (CVE)
    # - Brotli decompression RCE (CVE)
    nodeVersion: 22.23.4
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

  # ──────────────────────────────────────────────────────────
  # 2. Forex Signal Pro Frontend Terminal (Static Site)
  # ──────────────────────────────────────────────────────────
  - type: web
    name: forex-signal-pro-frontend
    runtime: static
    autoDeploy: true
    staticPublishPath: ./terminal
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
