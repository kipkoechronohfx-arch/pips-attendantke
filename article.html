  <link rel="stylesheet" href="dist.css">

  <!-- Structured Data: Breadcrumb -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.pipsattendant.com/" },
      { "@type": "ListItem", "position": 2, "name": "Blog", "item": "https://www.pipsattendant.com/blog.html" },
      { "@type": "ListItem", "position": 3, "name": "Article", "item": "https://www.pipsattendant.com/article.html" }
    ]
  }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="style.css">

  <style>
    .article-content h1, .article-content h2, .article-content h3 { color: #f9fafb; font-weight: 700; margin: 1.5rem 0 0.75rem; }
    .article-content h2 { font-size: 1.3rem; border-left: 3px solid #f59e0b; padding-left: 0.75rem; }
    .article-content h3 { font-size: 1.1rem; color: #fbbf24; }
    .article-content p { color: #9ca3af; line-height: 1.8; margin-bottom: 1rem; font-size: 0.9rem; }
    .article-content ul, .article-content ol { color: #9ca3af; padding-left: 1.5rem; margin-bottom: 1rem; font-size: 0.9rem; line-height: 1.8; }
    .article-content li { margin-bottom: 0.35rem; }
    .article-content strong { color: #f9fafb; }
    .article-content a { color: #fbbf24; text-decoration: underline; }
    .article-content blockquote { border-left: 3px solid #f59e0b; padding-left: 1rem; margin: 1.5rem 0; color: #d1d5db; font-style: italic; background: rgba(245,158,11,0.04); border-radius: 0 8px 8px 0; padding: 0.75rem 1rem; }
    .article-content code { background: rgba(255,255,255,0.08); border-radius: 4px; padding: 2px 6px; font-family: monospace; color: #fbbf24; font-size: 0.85em; }
    .article-content hr { border-color: rgba(255,255,255,0.08); margin: 2rem 0; }
  </style>
</head>
<body class="text-white font-inter min-h-screen relative selection:bg-amber-400/20 selection:text-amber-400 overflow-x-hidden" style="background-color:#0d0800;">

  <!-- Dubai Golden Background Image -->
  <div class="fixed inset-0 z-0 pointer-events-none" style="background-image:url('dubai_bg.webp');background-size:cover;background-position:center bottom;background-repeat:no-repeat;opacity:0.65;"></div>
  <!-- Subtle overlay -->
  <div class="fixed inset-0 z-0 pointer-events-none" style="background:linear-gradient(180deg,rgba(13,8,0,0.45) 0%,rgba(13,8,0,0.15) 40%,rgba(13,8,0,0.15) 70%,rgba(13,8,0,0.65) 100%);"></div>
  <!-- Ambient Glows -->
  <div class="fixed inset-0 z-0 pointer-events-none opacity-70">
    <div class="absolute top-[-10%] right-[-10%] w-[60%] h-[60%] rounded-full mix-blend-screen animate-pulse" style="background:radial-gradient(circle,rgba(245,158,11,0.28) 0%,transparent 70%);filter:blur(120px);"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-[55%] h-[50%] rounded-full mix-blend-screen animate-pulse" style="background:radial-gradient(circle,rgba(217,119,6,0.22) 0%,transparent 70%);filter:blur(100px);animation-delay:1.5s"></div>
  </div>

  <!-- Navigation -->
  <nav class="relative z-10 w-full p-6 flex justify-between items-center max-w-3xl mx-auto">
    <a href="blog.html" class="flex items-center gap-2 text-gray-400 hover:text-white transition group">
      <i data-feather="arrow-left" class="w-5 h-5 group-hover:-translate-x-1 transition"></i>
      <span class="text-sm font-bold">Back to Blog</span>
    </a>
    <a href="index.html" class="flex items-center gap-2 text-amber-400 hover:text-amber-300 transition">
      <span class="text-sm font-bold">Pips Attendant</span>
    </a>
  </nav>

  <!-- Main Content -->
  <main class="relative z-10 w-full px-6 pt-4 pb-20 max-w-3xl mx-auto">

    <!-- Loading State -->
    <div id="articleLoading" class="space-y-4">
      <div class="h-3 bg-white/5 rounded w-24 animate-pulse"></div>
      <div class="h-10 bg-white/5 rounded w-full animate-pulse"></div>
      <div class="h-10 bg-white/5 rounded w-3/4 animate-pulse"></div>
      <div class="h-3 bg-white/5 rounded w-40 animate-pulse mt-4"></div>
      <div class="h-px bg-white/5 my-8"></div>
      <div class="space-y-3">
        <div class="h-3 bg-white/5 rounded w-full animate-pulse"></div>
        <div class="h-3 bg-white/5 rounded w-5/6 animate-pulse"></div>
        <div class="h-3 bg-white/5 rounded w-full animate-pulse"></div>
        <div class="h-3 bg-white/5 rounded w-4/6 animate-pulse"></div>
      </div>
    </div>

    <!-- Error State -->
    <div id="articleError" class="hidden text-center py-24">
      <div class="text-6xl mb-6">📭</div>
      <h2 class="text-2xl font-bold text-white mb-3">Article Not Found</h2>
      <p class="text-gray-400 text-sm mb-8">This article may have been removed or the URL is incorrect.</p>
      <a href="blog.html" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-amber-400/10 border border-amber-400/30 text-amber-400 font-bold text-sm hover:bg-amber-400 hover:text-dark-navy transition">
        <i data-feather="arrow-left" class="w-4 h-4"></i> Browse All Articles
      </a>
    </div>

    <!-- Article Content -->
    <article id="articleContent" class="hidden">
      <!-- Category + Date -->
      <div id="articleMeta" class="flex items-center gap-3 mb-6 flex-wrap"></div>
      <!-- Title -->
      <h1 id="articleTitle" class="text-3xl md:text-4xl font-black text-white leading-tight mb-6"></h1>
      <!-- Cover Image -->
      <img id="articleCover" src="" alt="" loading="lazy" class="hidden w-full rounded-2xl border border-white/10 mb-8 object-cover max-h-72">
      <!-- Body -->
      <div id="articleBody" class="article-content"></div>
      <!-- CTA -->
      <div class="mt-12 p-6 rounded-2xl border border-amber-400/30 bg-amber-400/5 text-center">
        <p class="text-amber-400 font-bold mb-2">Ready to Apply This in Real Trades?</p>
        <p class="text-gray-400 text-xs mb-4">Join VIP to get daily signals, live analysis, and expert mentorship.</p>
        <a href="premium.html" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 text-dark-navy font-bold text-sm hover:brightness-110 transition">
          Unlock VIP Access <i data-feather="arrow-right" class="w-4 h-4"></i>
        </a>
      </div>
    </article>

  </main>

  <script>
    feather.replace();

    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      if (!slug) {
        showError(); return;
      }

      try {
        const res = await fetch(`/api/public/blog/${slug}`);
        if (!res.ok) { showError(); return; }
        const data = await res.json();
        if (!data.ok || !data.post) { showError(); return; }
        renderArticle(data.post);
      } catch(e) {
        showError();
      }
    }

    function showError() {
      document.getElementById('articleLoading').classList.add('hidden');
      document.getElementById('articleError').classList.remove('hidden');
      feather.replace();
    }

    function renderArticle(post) {
      // Update meta
      document.getElementById('docTitle').textContent = `${post.title} | Pips Attendant`;
      document.getElementById('docDescription').setAttribute('content', post.excerpt || '');

      // Update canonical to the specific article URL so Google indexes each article separately
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      if (slug) {
        let canonical = document.querySelector('link[rel="canonical"]');
        if (!canonical) {
          canonical = document.createElement('link');
          canonical.rel = 'canonical';
          document.head.appendChild(canonical);
        }
        canonical.href = `https://www.pipsattendant.com/article.html?slug=${encodeURIComponent(slug)}`;
      }

      // Render meta row
      const dateStr = post.publishedAt ? new Date(post.publishedAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
      document.getElementById('articleMeta').innerHTML = `
        <span class="text-xs font-bold px-3 py-1 rounded-full bg-amber-400/10 border border-amber-400/30 text-amber-400">${post.category || 'Market Analysis'}</span>
        ${dateStr ? `<span class="text-xs text-gray-500">${dateStr}</span>` : ''}
        <span class="text-xs text-gray-500">By ${post.author || 'Pips Attendant'}</span>
      `;

      document.getElementById('articleTitle').textContent = post.title;

      if (post.coverImage) {
        const img = document.getElementById('articleCover');
        img.src = post.coverImage;
        img.alt = post.title;
        img.classList.remove('hidden');
      }

      // Render HTML content (content should be stored as HTML from editor)
      document.getElementById('articleBody').innerHTML = post.content || '';

      document.getElementById('articleLoading').classList.add('hidden');
      document.getElementById('articleContent').classList.remove('hidden');
      feather.replace();
    }

    loadArticle();
  </script>
</body>
</html>
