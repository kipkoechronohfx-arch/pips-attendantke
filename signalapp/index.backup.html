<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest"><title>Forex Signal Pro</title><style>:root{font-family:Inter,system-ui,Arial;background:#0b1220;color:#e9f1fc}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px;background:#111d30;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:22px;margin:0}small,.muted{color:#9fb0c9}.badge{font-size:12px;padding:6px 9px;border-radius:12px;background:#483f23;color:#ffdf8d}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 70px)}nav{background:#101b2d;padding:20px 12px}nav button{display:block;width:100%;text-align:left;margin-bottom:8px}button,input,select{font:inherit}button{cursor:pointer;background:#20334c;border:1px solid #344b68;color:#eef5ff;padding:11px 13px;border-radius:10px}button:hover,.active{background:#1d5b66}main{padding:24px;max-width:1200px;width:100%;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#152238;border:1px solid #263952;border-radius:14px;padding:18px;margin-bottom:14px}.card h3{margin:0 0 10px}.metric{font-size:28px;font-weight:700;margin-top:8px}.green{color:#4ade80}.red{color:#ff7585}.pill{font-size:12px;border-radius:9px;padding:4px 8px;background:#244437}.sell{background:#4c2936}.flex{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.signal{display:grid;grid-template-columns:1.3fr repeat(3,1fr) auto;gap:12px;align-items:center}.signal span{display:block}.signal small{display:block;margin-bottom:4px}input,select{background:#0c1728;color:#f1f6ff;border:1px solid #3b516d;border-radius:8px;padding:11px;width:100%;margin:6px 0 14px}label{display:block;color:#bbcae0;font-size:14px}.hidden{display:none}a{color:#8edbff}.news a{display:block;margin:12px 0}.note{font-size:13px;color:#b6c6dd;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}td,th{padding:12px 6px;border-bottom:1px solid #2b3c54;text-align:left}#toast{position:fixed;right:18px;bottom:18px;background:#214d44;padding:14px;border-radius:9px;display:none}@media(max-width:800px){.layout{display:block}nav{display:flex;overflow:auto;gap:6px;padding:10px}nav button{white-space:nowrap;width:auto;margin:0}main{padding:14px}.grid{grid-template-columns:1fr}.signal{grid-template-columns:1fr 1fr}.signal .actions{grid-column:1/-1}} </style></head><body><header><div><h1>📈 Forex Signal Pro</h1><small>Signals • News • Economic intelligence</small></div><span class="badge">DEMO / NOT LIVE</span></header><div class="layout"><nav id="nav"></nav><main><section id="dashboard"></section><section id="signals" class="hidden"></section><section id="news" class="hidden"></section><section id="calendar" class="hidden"></section><section id="alerts" class="hidden"></section><section id="risk" class="hidden"></section><section id="admin" class="hidden"></section></main></div><div id="toast" role="status"></div><script>
const seed=[{id:1,pair:'EUR/USD',side:'BUY',entry:1.0852,sl:1.0822,tp:1.0912,source:'Automatic demo',time:'Sample only'},{id:2,pair:'GBP/USD',side:'SELL',entry:1.3024,sl:1.3064,tp:1.2944,source:'Automatic demo',time:'Sample only'},{id:3,pair:'USD/JPY',side:'BUY',entry:149.25,sl:148.85,tp:150.05,source:'Automatic demo',time:'Sample only'},{id:4,pair:'XAU/USD',side:'BUY',entry:2650,sl:2638,tp:2674,source:'Automatic demo',time:'Sample only'}];
let manual=JSON.parse(localStorage.getItem('fsp_manual')||'[]'), alerts=JSON.parse(localStorage.getItem('fsp_alerts')||'[]'), tab='dashboard';const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const all=()=>[...manual,...seed];const money=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:5});function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}
const tabs=['dashboard','signals','news','calendar','alerts','risk','admin'];function go(t){tab=t;tabs.forEach(x=>$(x).classList.toggle('hidden',x!==t));$('nav').innerHTML=tabs.map(x=>`<button class="${x===t?'active':''}" onclick="go('${x}')">${({dashboard:'▦ Dashboard',signals:'↗ Signals',news:'📰 News',calendar:'📅 Calendar',alerts:'🔔 Alerts',risk:'🧮 Risk Calculator',admin:'⚙ Admin Demo'})[x]}</button>`).join('');render()}
function signalCard(s){return `<div class="card signal"><div><b>${esc(s.pair)}</b><br><small>${esc(s.source)} · ${esc(s.time)}</small><span class="pill ${s.side==='SELL'?'sell':''}">${esc(s.side)}</span></div><div><small>Entry</small>${money(s.entry)}</div><div><small>Stop loss</small>${money(s.sl)}</div><div><small>Take profit</small>${money(s.tp)}</div><div class="actions"><button onclick="addAlert('${esc(s.pair)}')">🔔 Watch</button></div></div>`}
function render(){let s=all();$('dashboard').innerHTML=`<h2>Market overview</h2><p class="note">Sample setups below are fictional and are not computed from live prices. No trades are executed.</p><div class="grid"><div class="card">Tracked pairs<div class="metric">${new Set(s.map(x=>x.pair)).size}</div></div><div class="card">Sample setups<div class="metric">${s.length}</div></div><div class="card">Saved alerts<div class="metric">${alerts.length}</div></div></div><h2>Recent signals</h2>${s.slice(0,3).map(signalCard).join('')}<div class="card"><h3>Production status</h3><p class="note">Market feed: disconnected · News feed: disconnected · Calendar feed: disconnected · Push notifications: disconnected</p></div>`;
$('signals').innerHTML=`<div class="flex"><h2>Trading signals</h2><select id="filter" style="width:180px" onchange="renderFiltered()"><option>All</option><option>Automatic demo</option><option>Admin demo</option></select></div><div id="signalList">${s.map(signalCard).join('')}</div><p class="note">Automatic demo signals are illustrative fixtures, not an operating prediction engine.</p>`;
$('news').innerHTML=`<h2>Forex news</h2><div class="card news"><h3>External news sources</h3><p class="note">Live news aggregation is not configured. Open these providers for current reporting.</p><a href="https://www.reuters.com/markets/" target="_blank" rel="noopener">Reuters Markets ↗</a><a href="https://www.forexlive.com/" target="_blank" rel="noopener">ForexLive ↗</a><a href="https://www.fxstreet.com/news" target="_blank" rel="noopener">FXStreet ↗</a></div><div class="card"><h3>News feed integration</h3><p class="note">A production backend can ingest licensed provider headlines, deduplicate articles, store source and publication timestamp, and filter by affected currencies.</p></div>`;
$('calendar').innerHTML=`<h2>Economic calendar</h2><div class="card"><h3>Events to monitor</h3><table><tr><th>Event category</th><th>Relevant currency</th><th>Impact</th></tr><tr><td>US CPI / NFP / Fed decision</td><td>USD</td><td>High</td></tr><tr><td>ECB rate decision</td><td>EUR</td><td>High</td></tr><tr><td>BoE rate decision</td><td>GBP</td><td>High</td></tr><tr><td>BoJ rate decision</td><td>JPY</td><td>High</td></tr></table><p class="note">These are event categories, not scheduled occurrences or release dates.</p><a href="https://www.forexfactory.com/calendar" target="_blank" rel="noopener">View an external live calendar ↗</a></div>`;
$('alerts').innerHTML=`<h2>Watchlist & alerts</h2><div class="card"><label>Pair</label><select id="alertPair">${['EUR/USD','GBP/USD','USD/JPY','XAU/USD','USD/CHF'].map(p=>`<option>${p}</option>`).join('')}</select><label>Target price</label><input id="target" type="number" step="any" placeholder="e.g. 1.09"><button onclick="saveAlert()">Save local price watch</button><p class="note">Watches are stored on this device only. Price triggers and push notifications will not run until a live quote feed and notification service are connected.</p></div>${alerts.map((a,i)=>`<div class="card flex"><span>${esc(a.pair)} · target ${esc(a.target||'Not set')}</span><button onclick="deleteAlert(${i})">Remove</button></div>`).join('')}`;
$('risk').innerHTML=`<h2>Risk calculator</h2><div class="card"><label>Account balance (USD)</label><input id="balance" type="number" min="0" value="1000" oninput="calc()"><label>Risk per trade (%)</label><input id="riskpct" type="number" min="0" max="100" step="0.1" value="1" oninput="calc()"><label>Stop distance (pips)</label><input id="pips" type="number" min="0.1" step="0.1" value="30" oninput="calc()"><label>Pip value per standard lot (USD)</label><input id="pipval" type="number" min="0.01" step="0.01" value="10" oninput="calc()"><div class="grid"><div class="card">Planned risk<div id="riskout" class="metric green"></div></div><div class="card">Estimated lots<div id="lotsout" class="metric"></div></div><div class="card">Units (100k/lot)<div id="unitsout" class="metric"></div></div></div><p class="note">Enter the correct pip value for the instrument and account currency. This simplified model excludes spread, fees, slippage and margin constraints; losses can exceed planned risk.</p></div>`;calc();
$('admin').innerHTML=`<h2>Admin signal publisher — local demo</h2><div class="card"><p class="note">No authentication or server publishing is configured. Entries are visible only in this browser and must not be treated as verified recommendations.</p><label>Pair</label><select id="apair">${['EUR/USD','GBP/USD','USD/JPY','XAU/USD','USD/CHF'].map(p=>`<option>${p}</option>`).join('')}</select><label>Direction</label><select id="aside"><option>BUY</option><option>SELL</option></select><label>Entry</label><input type="number" step="any" id="aentry"><label>Stop loss</label><input type="number" step="any" id="asl"><label>Take profit</label><input type="number" step="any" id="atp"><button onclick="publish()">Publish demo signal</button></div>${manual.map(x=>`<div class="card flex"><span>${esc(x.pair)} · ${esc(x.side)} · ${money(x.entry)}</span><button onclick="removeSignal(${x.id})">Delete</button></div>`).join('')}`;}
function renderFiltered(){let f=$('filter').value;$('signalList').innerHTML=all().filter(s=>f==='All'||s.source===f).map(signalCard).join('')||'<p>No signals match this filter.</p>'}function addAlert(p){alerts.push({pair:p,target:''});persistAlerts();toast('Pair added to local watchlist')}function saveAlert(){let t=Number($('target').value);if(!Number.isFinite(t)||t<=0)return toast('Enter a valid positive target');alerts.push({pair:$('alertPair').value,target:t});persistAlerts();toast('Price watch saved locally')}function deleteAlert(i){alerts.splice(i,1);persistAlerts()}function persistAlerts(){localStorage.setItem('fsp_alerts',JSON.stringify(alerts));render()}function calc(){let b=Number($('balance')?.value),r=Number($('riskpct')?.value),p=Number($('pips')?.value),v=Number($('pipval')?.value),valid=b>=0&&r>=0&&r<=100&&p>0&&v>0;let amount=valid?b*r/100:NaN,lots=valid?amount/(p*v):NaN;$('riskout').textContent=Number.isFinite(amount)?'$'+amount.toFixed(2):'—';$('lotsout').textContent=Number.isFinite(lots)?lots.toFixed(3):'—';$('unitsout').textContent=Number.isFinite(lots)?Math.round(lots*100000).toLocaleString():'—'}function publish(){let pair=$('apair').value,side=$('aside').value,entry=Number($('aentry').value),sl=Number($('asl').value),tp=Number($('atp').value);if([entry,sl,tp].some(x=>!Number.isFinite(x)||x<=0)||!$('aentry').value||!$('asl').value||!$('atp').value)return toast('Enter positive prices');if(side==='BUY'&&!(sl<entry&&entry<tp)||side==='SELL'&&!(tp<entry&&entry<sl))return toast('Stop/target direction is invalid');manual.unshift({id:Date.now(),pair,side,entry,sl,tp,source:'Admin demo',time:new Date().toLocaleString()});localStorage.setItem('fsp_manual',JSON.stringify(manual));toast('Demo signal published locally');go('signals')}function removeSignal(id){manual=manual.filter(x=>x.id!==id);localStorage.setItem('fsp_manual',JSON.stringify(manual));render()}go('dashboard');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
